name: Handle User Registration

on:
  workflow_dispatch:
    inputs:
      username:
        description: '用户名'
        required: true
      password_hash:
        description: '密码哈希'
        required: true
      email:
        description: '邮箱'
        required: false
      captcha_answer:
        description: '验证问题答案'
        required: true

jobs:
  process-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Process Registration
        env:
          USERNAME: ${{ github.event.inputs.username }}}
          PASSWORD_HASH: ${{ github.event.inputs.password_hash }}
          EMAIL: ${{ github.event.inputs.email || '' }}}
          CAPTCHA_ANSWER: $ ${{ github.event.inputs.captcha_answer }}
          GITHUB_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
        run: |
          python .github/scripts/process_registration_dispatch.py

      - name: Commit and push users.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/users.json
          git commit -m "feat: 新用户注册 - ${USERNAME}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
