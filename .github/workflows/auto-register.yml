name: Auto Process User Registration

on:
  issues:
    types: [opened]

jobs:
  process-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Process Registration
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
        run: |
          python .github/scripts/process_registration.py

      - name: Commit and push users.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/users.json
          git commit -m "feat: 新用户注册 - Issue #${{ github.event.issue.number }}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}

      - name: Close Issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER \
            -d '{"state": "closed"}'

      - name: Comment on Issue (Success)
        if: success()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments \
            -d '{"body":"✅ 注册已成功处理！您现在可以使用用户名和密码登录系统。"}'

      - name: Comment on Issue (Failure)
        if: failure()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments \
            -d '{"body":"❌ 注册失败，请检查填写的信息是否正确。验证问题答案必须包含\"中国银行\"和\"分行\"。。"}'
