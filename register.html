<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 雪球产品展示系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .message.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }
        .message.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }
        .message.info {
            background: #eef;
            color: #00a;
            border: 1px solid #ccf;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .invite-box {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #d0d9ff;
        }
        .invite-box label {
color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .invite-box .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .progress-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e1e1e1;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <divD>
    <div class="container">
        <h1>📝 用户注册</h1>
        
        <div id="message" class="message"></div>
        
        <div class="invite-box">
            <label>🔑 邀请码 *</label>
<            <input type="text" id="inviteCode" required placeholder="请输入邀请码（格式：INVITE-XXXXXX）">
            <div class="help-text">联系管理员获取邀请码，格式为 "INVITE-XXXXXX"</div>
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="username" required placeholder="6-20 位字母、数字或下划线">
                <div class="help-text">用户名长度 6-20 个字符</div>
            </div>
            
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" id="password" required placeholder="至少 6 位，包含字母和数字">
                <div class="help-text">密码长度至少 6 位，包含字母和数字</div>
            </div>
            
            <div class="form-group">
                <label>确认密码 *</label>
                <input type="password" id="confirmPassword" required placeholder="再次输入密码">
            </div>
            
            <div class="form-group">
                <label>邮箱（可选）</label>
                <input type="email" id="email" placeholder="用于找回密码">
            </div>
            
            <button type="submit" class="btn" id="submitBtn">注册并登录</button>
        </form>
        
        <div class="login-link">
            已有账号？<a href="index.html">立即登录</a>
        </div>
    </div>
    
    <!-- 进度提示 -->
    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-box">
            <div class="spinner"></div>
            <h3 style="color: #333; margin-bottom: 10px;">正在注册...</h3>
            <p id="progressText" style="color: #666; margin-bottom: 15px;">创建账号中，请稍候</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        // 配置 - 你的 GitHub Token（混淆存储）
        const GITHUB_CONFIG = {
            owner: 'lee8523',
            repo: 'snowb',
            branch: 'main',
            // Token 简单 Base64 混淆（非绝对安全，但防普通人查看）
            token: btoa('YOUR_GITHUB_TOKEN_HERE') // ⚠️ 替换为你的真实 Token
        };
        
        const INVITES_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/data/invites.json?t=${Date.now()}`;
        const USERS_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/data/users.json?t=${Date.now()}`;
        
        // 获取 Token
        function getToken() {
            return atob(GITHUB_CONFIG.token);
        }
        
        // 显示消息
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            if (type !== 'info') {
                setTimeout(() => { msg.style.display = 'none'; }, 5000);
            }
        }
        
        // 验证用户名
        function validateUsername(username) {
            if (username.length < 6 || username.length > 20) {
                return { valid: false, message: '用户名长度 6-20 个字符' };
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                return { valid: false, message: '用户名只能包含包含字母、数字、下划线' };
            }
            return { valid: true };
        }
        
        // 验证密码
        function validatePassword(password) {
            if (password.length < 6) {
                return { valid: false, message: '密码长度至少 6 位' };
            }
            if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                return { valid: false, message: '密码必须包含字母和数字' };
            }
            return { valid: true };
        }
        
        // 验证邀请码格式
        function validateInviteCode(code) {
            return /^INVITE-[A-Z0-9]+$/.test(code.trim());
        }
        
        // SHA-256 哈希
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        // 读取 JSON 文件（带 Token）
        async function readGitHubFile(url, filename) {
            const token = getToken();
            const response = await fetch(url, {
                headers: {
                    'Authorization: `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            
            if (!response.ok) {
                if (response.status === 404) {
                    return filename === 'invites' ? { invites: [] } : { users: [] };
                }
                throw new Error(`读取${filename}失败：${response.status}`);
            }
            
 return await response.json();
        }
        
        // 更新 GitHub 文件
        async function updateGitHubFile(filename, content, message) {
            const token = getToken();
            const path = `data/${filename}.json`;
            
            // 获取当前文件的 SHA
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}?ref=${GITHUB_CONFIG.branch}`;
            const response = await fetch(url, {
                headers splicehash = currentFile.sha;
            } catch (e) {
                console.log('文件不存在，将创建新文件');
            }
            
            // 编码内容
            const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));
            
            // 更新文件
            const updateData = {
                message: message,
                content: encodedContent,
                branch: GITHUB_CONFIG.branch
            };
            if (sha) {
                updateData.sha = sha;
            }
            
            const updateResponse = await fetch(url, {
                method: 'PUT',
                headers = {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content': 'application/json",
                body: JSON\n                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updateData)
            });
            
            if (!updateResponse.ok) {
                throw new Error(`更新文件失败：${updateResponse.status}`);
            }
            
            return await updateResponse.json();
        }
        
        // 轮询等待（模拟）
        function waitForCompletion(callback) {
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                document.getElementById('progressFill').style.width = `${progress}%`;
                
                if (progress === 30) {
                    document.getElementById('progressText').textContent = '验证邀请码...';
                } else if (progress === 60) {
                    document.getElementById('progressText').textContent = '创建用户账号...';
                } else if (progress === 90) {
                    document.getElementById('progressText').textContent = '完成注册，正在登录...';
                }
                
                if (progress >= 100) {
                    clearInterval(interval);
                    callback();
                }
            }, 300);
        }
        
        // 注册主逻辑
        async function handleRegister() {
            const inviteCode = document.getElementById('inviteCode').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value.trim();
            
            // 验证邀请码
            if (!validateInviteCode(inviteCode)) {
                showMessage('邀请码格式错误，应为 INVITE-XXXXXX 格式', 'error');
                return;
            }
            
            // 验证用户名
            const usernameCheck = validateUsername(username);
            if (!usernameCheck.valid) {
                showMessage(usernameCheck.message, 'error');
                return;
            }
            
            // 验证密码
            const passwordCheck = validatepasswordCheck.valid) {
                showMessage(passwordCheck.message, 'error');
                return;
            }
            
            // 验证密码一致性
            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            try {
                // 显示进度
                document.getElementById('progressOverlay').style.display = 'flex';
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressText').textContent = '验证邀请码...';
                
                // 读取邀请码列表
                const invitesData = await readGitHubFile(INVITES_URL, 'invites');
                
                // 检查邀请码是否有效
                if (!invitesData.invites.includes(inviteCode)) {
                    throw new Error('邀请码无效或已被使用');
                }
                
                // 读取现有用户列表
                const usersData = await readGitHubFile(USERS_URL, 'users');
                
                // 检查用户名是否已存在
                if (usersData.users.some(u => u.username === username)) {
                    throw new Error('用户名已存在');
                }
                
                // 生成密码哈希
                const passwordHash = await hashPassword(password);
                
                // 创建新用户
                const newUser = {
                    username: username,
                    password_hash: passwordHash,
                    email: email || null,
                    invite_code_used: inviteCode,
                    created_at: new Date().toISOString(),
                    registered_via: 'direct_registration'
                };
                
                // 添加到用户列表
                usersData.users.push(newUser);
                usersData.last_updated = new Date().toISOString();
                
                // 从邀请码列表中移除已使用的邀请码
                invitesData.invites = invitesData.invites.filter(code => code !== inviteCode);
                invitesData.last_updated = new Date().toISOString();
                invitesData.usage_count = (invitesData.usage_count || 0) + 1;
                
                document.getElementById('progressFill').style.width = '60%';
                document.getElementById('progressText').textContent = '提交用户数据...';
                
                // 更新 users.json
                await updateGitHubFile('users', usersData, `feat: 新用户注册 - ${username}`);
                
                // 更新 invites.json
                await updateGitHubFile('invites', invitesData, `feat: 邀请码使用 - ${inviteCode}`);
                
                document.getElementById('progressFill').style.width = '90%';
                document.getElementById('progressText').textContent = '完成注册，正在登录...';
                
                // 保存登录状态
                localStorage.setItem('authenticated', 'true');
                localStorage.setItem('current_user', username);
                localStorage.setItem('user_email', email || '');
                
                // 延迟跳转
                setTimeout(() => {
                    windowshowMessage('注册成功！正在跳转到产品页面...', 'success');
                    window.location.href = 'products.html';
                }, 1500);
                
            } catch (error) {
                document.getElementById('progressOverlay').style.display = 'none';
                showMessage('注册失败：' + error.message, 'error');
                console.error('注册错误:', error);
            }
        }
        
        // 绑定表单提交事件
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            handleRegister();
        });
        
        // 检查是否已登录
        if (localStorage.getItem('authenticated') === 'true') {
            window.location.href = 'products.html';
        }
    </script>
</body>
</html>
