<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 雪球产品展示系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 40px; max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input[type="text"], input[type="password"], input[type="email"], textarea { width: 100%; padding: 12px; border: 2px solid #e1e1e1; border-radius: 8px; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        textarea { min-height: 150px; font-family: monospace; font-size: 12px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .message.error { background: #fee; color: #c00; border: 1px solid #fcc; }
        .message.success { background: #efe; color: #0a0; border: 1px solid #cfc; }
        .info-box { background: #e7f3ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #0056b3; border: 1px solid #b3d9ff; }
        .info-box a { color: #007bff; }
        .captcha-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e1e1e1; }
        .help-text { font-size: 12px; color: #888; margin-top: 5px; }
        .result-section { display: none; margin-top: 20px; }
        .result-section.show { display: block; }
        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 用户注册</h1>
        <div id="message" class="message"></div>
        
        <div class="info-box">
            <strong>💡 注册流程</strong><br>
            1. 填写下方表单，点击"生成注册申请"<br>
            2. 复制生成的文本<br>
            3. <a href="https://github.com/lee8523/snowb/issues/new" target="_blank">前往 GitHub 创建 Issue</a> 并粘贴<br>
            4. 系统自动审核并创建账号（1-2 分钟）
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="username" required placeholder="6-20 位字母、数字或下划线">
                <div class="help-text">用户名长度 6-20 个字符</div>
            </div>
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" id="password" required placeholder="至少 6 位，包含字母和数字">
            </div>
            <div class="form-group">
                <label>确认密码 *</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <div class="form-group">
                <label>邮箱（可选）</label>
                <input type="email" id="email" placeholder="用于找回密码">
            </div>
            <div class="captcha-box">
                <label style="font-weight:600;color:#333;">🔒 验证问题：您的所在公司/机构名称 *</label>
                <input type="text" id="captchaAnswer" required placeholder="请输入答案">
                <div class="help-text">答案格式："中国银行 XX 分行"</div>
            </div>
            <button type="button" class="btn" id="generateBtn">生成注册申请</button>
        </form>
        
        <div id="resultSection" class="result-section">
            <div class="form-group">
                <label>注册申请内容（请复制）：</label>
                <textarea id="resultText" readonly></textarea>
                <div class="help-text" id="copyHint" style="color:#28a745;display:none;">✅ 已复制到剪贴板</div>
            </div>
            <button class="btn btn-secondary" id="copyBtn">复制</button>
            <button class="btn" id="gotoIssueBtn">前往 GitHub 创建 Issue</button>
        </div>
        
        <div class="login-link">
            已有账号？<a href="index.html">立即登录</a>
        </div>
    </div>

    <script>
        function validateUsername(username) {
            if (username.length < 6 || username.length > 20) return { valid: false, message: '用户名长度 6-20 个字符' };
            if (!/^[a-zA-Z0-9_/]+$/.'.test(username)) return { valid: false, message: '用户名只能包含字母、数字、下划线' };
            return { valid: true };
        }
        
        function validatePassword(password) {
            if (password.length < 6) return { valid: false, message: '密码长度至少 6 位' };
            if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) return { valid: false, message: '密码必须必须包含字母和数字' };;
            return return { valid: true };
        }
        
        function validateCaptcha(answer) {
            const normalized = answer.trim().toLowerCase();
            return normalized.includes('中国银行') && normalized.includes('分行');
        }
        
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
        
        document.getElementById('generateBtn').addEventListener('click', async function() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value.trim();
            const captchaAnswer = document.getElementById('captchaAnswer').value.trim();
            
            const usernameCheck = validateUsername(username);
            if (!usernameCheck.valid) { showMessage(usernameCheck.message, 'error'); return; }}
            
            const'server';
            
            const passwordCheck = validatePassword(password);
            if (!passwordCheck.valid) { showMessage(passwordCheck.message, 'error'); return; }
            
            if (password !== # 验证问题答案
            if (!validateCaptcha(captchaAnswer)) {
                showMessage('验证问题答案错误。正确答案格式："中国银行 XX 分行"', 'error');
                return;
            }
            
            const passwordHash = await hashPassword(password);
            
            const issueTitle = '用户注册：' + username;
            const issueBody = `## 用户注册申请

**用户名**: ${username}
**密码哈希**: ${passwordHash}
**邮箱**: ${email || '未提供'}
**验证答案**: ${captchaAnswer}
**注册时间**: ${new Date().toISOString()}

---
*请 GitHub Actions 自动处理此注册申请*`;
            
            document.getElementById('resultText').value = issueBody;
            document.getElementById('resultSection').classList.add('show');
            document.getElementById('generateBtn').style.display = 'none';
            showMessage('注册申请已生成！请复制下方文本并前往 GitHub 创建 Issue', 'success');
        });
        
        document.getElementById('copyBtn').addEventListener('click', function() {
            const resultText = document.getElementById('resultText');
            resultText.select();
            document.execCommand('copy');
            document.getElementById('copyHint').style.display = 'block';
            setTimeout(() => { document.getElementById('copyHint').style.display = 'none'; }, 2000);
        });
        
        document.getElementById('gotoIssueBtn').addEventListener('click', function() {
            window.open('httpshttps://github.com/lee8523/snowb/issues/new', '_blank');
        });
    </script>
</body>
</html>
